<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Información · Violencia Contra la Mujer</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

  <!-- ===================== LOGIN ===================== -->
  <div id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="login-card glass" autocomplete="off">
      <img src="assets/logo.png" alt="Logo" class="login-logo">
      <h1>Inicio de sesión</h1>
      <p class="sub">Sistema de Información de Violencia Contra la Mujer</p>

      <label for="u">Usuario</label>
      <input id="u" type="text" placeholder="Ingrese su usuario" value="admin" required>

      <label for="p">Contraseña</label>
      <input id="p" type="password" placeholder="Ingrese su contraseña" value="admin123" required>

      <div id="login-err" class="err" hidden></div>
      <button type="submit" class="btn-main" id="login-btn">Ingresar al sistema</button>
      <p class="mode" id="mode-note"></p>
    </form>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="app-view" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="assets/logo.png" alt="Logo">
        <div><small>SISTEMA DE INFORMACIÓN</small><b>Violencia Contra la Mujer</b></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot">Lima y Callao<br>2023 – 2025</div>
    </aside>

    <main class="main">
      <header class="topbar glass">
        <button class="burger" id="burger" aria-label="Menú">☰</button>
        <div class="ttl">
          <h2>Sistema de Información</h2>
          <span>Violencia Contra la Mujer</span>
        </div>
        <div class="slogan">Más información,<br>más protección</div>
        <label class="yearbox">Año:
          <select id="year"></select>
        </label>
        <div class="user"><span class="avatar">A</span> Administrador</div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
